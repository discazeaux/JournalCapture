<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/ruche4.png">
    <title>Connexion — La ruche résiste</title>
    <script src="js/config.js"></script>
    <script src="js/navigation.js"></script>
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6E1WMD3WXD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6E1WMD3WXD');
    </script>

</head>

<body class="login-page">

    <div class="login-content">
        <span class="bee"><img class="login-emoji" src="img/mordre.png" alt="Frelon" aria-label="Frelon"></span>
        <h1>Suivi de la pression du frelon</h1>
        <p class="subtitle">Connectez-vous pour accéder à l'application</p>

        <div class="card">
        <div class="tabs">
            <button class="tab active" id="tabConnexion">Connexion</button>
            <button class="tab" id="tabInscription">Créer un compte</button>
        </div>

        <!-- Formulaire connexion -->
        <div id="formConnexion">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="votre@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn" id="btnConnexion">Se connecter</button>
            <p class="forgot-password">
                <a href="#" id="lienMotDePasseOublie">Mot de passe oublié ?</a>
            </p>
        </div>

        <!-- Formulaire inscription -->
        <div id="formInscription" style="display:none">
            <div class="form-group">
                <label>Pseudo</label>
                <input type="text" id="inscriptionPseudo" placeholder="ex: Marie, Jean-Pierre…" maxlength="30">
                <p class="pseudo-hint">Ce nom sera affiché sur vos captures</p>
            </div>
            <div class="form-group">
                <label>Code postal</label>
                <input type="text" id="inscriptionCodePostal" placeholder="ex: 75001" maxlength="10">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="inscriptionEmail" placeholder="votre@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="inscriptionPassword" placeholder="Minimum 6 caractères"
                    autocomplete="new-password">
            </div>
            <button class="btn" id="btnInscription">Créer mon compte</button>
        </div>

        <div class="message" id="message"></div>
        </div>
    </div>
    <footer>
         <div class="flaticon-credit">
            <a href="https://www.flaticon.com/fr/icones-gratuites/apiculture" title="apiculture icônes">Apiculture icônes créées par iconixar - Flaticon</a>
            </div><div><a href="https://www.flaticon.com/fr/icones-gratuites/abeille" title="abeille icônes">Abeille icônes créées par iconixar - Flaticon</a>
        </div>
    </footer>
    
    <script>
        initNavigation({ univers: 'frelon', sectionActive: 'accueil' });
    </script>

    <script type="module">
        import { initLoginPage } from "./js/pages/login.js";
        initLoginPage();
    </script>
</body>

</html>
