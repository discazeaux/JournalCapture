<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Suivi de la pression du frelon</title>
    <script src="navigation.js"></script>
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="styles.css"><!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6E1WMD3WXD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-6E1WMD3WXD');
</script>

</head>

<body class="login-page">

    <div class="login-content">
        <span class="bee"><img class="login-emoji" src="mordre.png" alt="Frelon" aria-label="Frelon"></span>
        <h1>Suivi de la pression du frelon</h1>
        <p class="subtitle">Connectez-vous pour accéder à l'application</p>

        <div class="card">
        <div class="tabs">
            <button class="tab active" id="tabConnexion" onclick="afficherOnglet('connexion')">Connexion</button>
            <button class="tab" id="tabInscription" onclick="afficherOnglet('inscription')">Créer un compte</button>
        </div>

        <!-- Formulaire connexion -->
        <div id="formConnexion">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="votre@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn" id="btnConnexion" onclick="seConnecter()">Se connecter</button>
        </div>

        <!-- Formulaire inscription -->
        <div id="formInscription" style="display:none">
            <div class="form-group">
                <label>Pseudo</label>
                <input type="text" id="inscriptionPseudo" placeholder="ex: Marie, Jean-Pierre…" maxlength="30">
                <p class="pseudo-hint">Ce nom sera affiché sur vos captures</p>
            </div>
            <div class="form-group">
                <label>Code postal</label>
                <input type="text" id="inscriptionCodePostal" placeholder="ex: 75001" maxlength="10">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="inscriptionEmail" placeholder="votre@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="inscriptionPassword" placeholder="Minimum 6 caractères"
                    autocomplete="new-password">
            </div>
            <button class="btn" id="btnInscription" onclick="sInscrire()">Créer mon compte</button>
        </div>

            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        initNavigation({ univers: 'frelon', sectionActive: 'accueil' });
    </script>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        window.afficherOnglet = function (onglet) {
            document.getElementById('formConnexion').style.display = onglet === 'connexion' ? 'block' : 'none';
            document.getElementById('formInscription').style.display = onglet === 'inscription' ? 'block' : 'none';
            document.getElementById('tabConnexion').classList.toggle('active', onglet === 'connexion');
            document.getElementById('tabInscription').classList.toggle('active', onglet === 'inscription');
            document.getElementById('message').className = 'message';
        };

        function afficherMessage(texte, type) {
            const el = document.getElementById('message');
            el.textContent = texte;
            el.className = 'message ' + type;
        }

        window.seConnecter = async function () {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnConnexion');

            if (!email || !password) { afficherMessage('Veuillez remplir tous les champs.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Connexion…';

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                afficherMessage('Email ou mot de passe incorrect.', 'error');
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            } else {
                afficherMessage('Connexion réussie, redirection…', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            }
        };

        window.sInscrire = async function () {
            const pseudo = document.getElementById('inscriptionPseudo').value.trim();
            const codePostal = document.getElementById('inscriptionCodePostal').value.trim();
            const email = document.getElementById('inscriptionEmail').value.trim();
            const password = document.getElementById('inscriptionPassword').value;
            const btn = document.getElementById('btnInscription');

            if (!pseudo || !email || !password) { afficherMessage('Veuillez remplir tous les champs.', 'error'); return; }
            if (password.length < 6) { afficherMessage('Le mot de passe doit faire au moins 6 caractères.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Création…';

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                afficherMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Créer mon compte';
                return;
            }

            // Sauvegarder le pseudo dans la table profils (rôle par défaut : user)
            const { error: errorProfil } = await supabase
                .from('profils')
                .insert({ id: data.user.id, pseudo, codePostal, role: 'user' });

            if (errorProfil) {
                afficherMessage('Compte créé mais erreur sur le pseudo : ' + errorProfil.message, 'error');
            } else {
                afficherMessage('Compte créé ! Vous pouvez vous connecter.', 'success');
                setTimeout(() => afficherOnglet('connexion'), 2000);
            }

            btn.disabled = false;
            btn.textContent = 'Créer mon compte';
        };

        // Vérifier si déjà connecté (une seule fois, sans boucle)
        let dejaRedirige = false;
        const { data: { session } } = await supabase.auth.getSession();
        if (session && !dejaRedirige) {
            dejaRedirige = true;
            window.location.href = 'index.html';
        }

        // Écouter les changements d'état uniquement pour la connexion réussie
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' && session && !dejaRedirige) {
                dejaRedirige = true;
                window.location.href = 'index.html';
            }
        });

        // Connexion avec Entrée
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const ongletActif = document.getElementById('formConnexion').style.display !== 'none';
                if (ongletActif) window.seConnecter();
                else window.sInscrire();
            }
        });
    </script>
</body>

</html>
