<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article — Suivi Frelons</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg: #faf7f0;
            --card: #ffffff;
            --yellow: #b8860b;
            --yellow-soft: #f5e6b8;
            --yellow-dim: rgba(184, 134, 11, 0.08);
            --text: #2d2a24;
            --muted: #8a8578;
            --border: #e8e2d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 40px 24px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 48px;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 18px;
            background: var(--card);
            transition: border-color 0.2s, color 0.2s;
        }

        .back-link:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .user-bar {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .user-bar .pseudo {
            color: var(--yellow);
        }

        .user-bar .bee-small {
            font-size: 18px;
        }

        .user-bar button, .user-bar a {
            background: none;
            border: 1px solid var(--border);
            border-radius: 99px;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .user-bar button:hover, .user-bar a:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .article {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 56px 60px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .article h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .article .meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.3px;
        }

        .article .content {
            font-size: 17px;
            line-height: 1.9;
            color: var(--text);
        }

        .article .content p {
            margin-bottom: 22px;
        }

        .article .content h1,
        .article .content h2,
        .article .content h3,
        .article .content h4 {
            color: var(--text);
            margin: 36px 0 14px;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }

        .article .content h1 { font-size: 30px; }
        .article .content h2 { font-size: 26px; }
        .article .content h3 { font-size: 21px; }
        .article .content h4 { font-size: 18px; }

        .article .content ul, .article .content ol {
            margin: 0 0 22px 24px;
        }

        .article .content li {
            margin-bottom: 8px;
        }

        .article .content a {
            color: var(--yellow);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .article .content blockquote {
            border-left: 3px solid var(--yellow);
            padding: 4px 0 4px 20px;
            margin: 0 0 22px;
            color: var(--muted);
            font-style: italic;
            background: var(--yellow-dim);
            border-radius: 0 8px 8px 0;
        }

        .article .content code {
            background: var(--yellow-soft);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 15px;
            color: var(--text);
        }

        .article .content pre {
            background: #f4f0e6;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            overflow-x: auto;
            margin-bottom: 22px;
        }

        .article .content pre code {
            background: none;
            border: none;
            padding: 0;
        }

        .article .content img {
            max-width: 100%;
            border-radius: 10px;
            margin: 16px 0;
        }

        .article .content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 32px 0;
        }

        .article .content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 22px;
        }

        .article .content th,
        .article .content td {
            border: 1px solid var(--border);
            padding: 10px 14px;
            text-align: left;
        }

        .article .content th {
            background: var(--yellow-soft);
            color: var(--text);
            font-weight: 600;
        }

        .not-found {
            text-align: center;
            color: var(--muted);
            padding: 80px 20px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            font-size: 15px;
            background: var(--card);
        }

        .not-found .bee {
            font-size: 44px;
            display: block;
            margin-bottom: 16px;
        }

        .article-edit-bar {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .edit-btn {
            display: inline-block;
            background: var(--yellow-dim);
            border: 1px solid var(--yellow);
            color: var(--yellow);
            border-radius: 99px;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 22px;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .edit-btn:hover {
            background: var(--yellow-soft);
            color: var(--yellow);
        }

        footer {
            margin-top: 64px;
            color: var(--border);
            font-size: 12px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .user-bar {
                top: 12px;
                right: 12px;
                padding: 6px 12px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
                margin-bottom: 36px;
            }
            .article {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="user-bar" id="userBar">
        <!-- rempli par JS -->
    </div>

    <div class="container">
        <div class="header">
            <a class="back-link" href="blog.html">← Blog</a>
        </div>

        <div id="articleContainer">
            <!-- rempli par JS -->
        </div>
    </div>

    <footer>suivi-frelons</footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById("userBar");
        const container = document.getElementById("articleContainer");

        const { data: { session } } = await supabase.auth.getSession();

        let estAdmin = false;
        if (session) {
            const { data: profil } = await supabase
                .from("profils")
                .select("pseudo, role")
                .eq("id", session.user.id)
                .single();

            const pseudo = profil?.pseudo || session.user.email;
            estAdmin = profil?.role === 'admin';

            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                ${estAdmin ? '<a href="rediger.html">✏️ Rédiger</a>' : ''}
                <button id="btnDeconnexion">Se déconnecter</button>
            `;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });
        } else {
            bar.innerHTML = `
                <button id="btnConnexion">Se connecter</button>
            `;
            document.getElementById("btnConnexion").addEventListener("click", () => {
                window.location.href = "login.html";
            });
        }

        // Lire le paramètre ?slug=... dans l'URL
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");

        if (!slug) {
            container.innerHTML = `
                <div class="not-found">
                    <span class="bee">🐝</span>
                    Aucun article spécifié.
                </div>
            `;
        } else {
            const { data: article, error } = await supabase
                .from("articles")
                .select("titre, contenu, created_at, auteur_id")
                .eq("slug", slug)
                .eq("publie", true)
                .single();

            if (error || !article) {
                console.error("Erreur chargement article:", error);
                container.innerHTML = `
                    <div class="not-found">
                        <span class="bee">🐝</span>
                        Article introuvable ou non publié.
                    </div>
                `;
            } else {
                const date = new Date(article.created_at).toLocaleDateString("fr-FR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });

                document.title = `${article.titre} — Suivi Frelons`;

                // Convertir le Markdown en HTML
                const htmlContenu = marked.parse(article.contenu || "");

                container.innerHTML = `
                    <article class="article">
                        <h1>${article.titre}</h1>
                        <div class="meta">
                            <span>🐝</span>
                            <span>${date}</span>
                        </div>
                        <div class="content">${htmlContenu}</div>
                        ${estAdmin ? `
                            <div class="article-edit-bar">
                                <a class="edit-btn" href="rediger.html?slug=${encodeURIComponent(slug)}">✏️ Modifier cet article</a>
                            </div>
                        ` : ''}
                    </article>
                `;
            }
        }
    </script>

</body>
</html>
