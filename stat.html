<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques captures</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="user-bar" id="userBar"></div>

    <nav class="navbar">
        <a href="index.html">🐝 Accueil</a>
        <a id="navCapture" href="nouvelleCapture.html">📋 Nouvelle capture</a>
        <a href="stat.html" class="active">📊 Statistiques</a>
        <a href="mesStats.html" id="navMesStats" style="display:none">📈 Mes stats</a>
    </nav>

    <div class="container">
        <div class="stat">
            <div class="stat-title">Total individus capturés</div>
            <div class="valeur" id="totalNombre">0</div>
        </div>

        <div class="stat">
            <h2>📅 Captures par semaine par méthode</h2>
            <canvas id="capturesSemaineMethode"></canvas>
            <table id="tableSemaine">
                <thead>
                    <tr id="tableSemaineHeader">
                        <th>Semaine</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById("userBar");
        const { data: { session } } = await supabase.auth.getSession();

        if (session) {
            const { data: profil, error: errorProfil } = await supabase
                .from("profils")
                .select("pseudo")
                .eq("id", session.user.id)
                .single();

            const pseudo = profil?.pseudo || session.user.email;

            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                <button id="btnDeconnexion">Se déconnecter</button>
            `;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });

            document.getElementById("navMesStats").style.display = "";
        } else {
            bar.innerHTML = `
                <button id="btnConnexion">Se connecter</button>
            `;
            document.getElementById("btnConnexion").addEventListener("click", () => {
                window.location.href = "login.html";
            });

            const navCapture = document.getElementById("navCapture");
            if (navCapture) navCapture.style.display = "none";
            document.getElementById("navMesStats").style.display = "none";
        }

        async function chargerStats() {
            const { data, error } = await supabase
                .from("captures")
                .select("*")
                .order("date_capture", { ascending: true });

            if (error) {
                console.error(error);
                alert(error.message);
                return;
            }

            const totalNombre = data.reduce(
                (total, capture) => total + (capture.nombre || 0),
                0
            );
            document.getElementById("totalNombre").textContent = totalNombre;

            function getNumeroSemaine(dateStr) {
                const date = new Date(dateStr);
                const debut = new Date(date.getFullYear(), 0, 1);
                const diff = date - debut;
                const unJour = 86400000;
                const joursDepuisDebut = Math.floor(diff / unJour);
                const semaine = Math.ceil((joursDepuisDebut + debut.getDay() + 1) / 7);
                return date.getFullYear() + "-S" + String(semaine).padStart(2, "0");
            }

            let parSemaineMethode = {};
            let toutesMethodes = new Set();

            data.forEach(capture => {
                const semaine = getNumeroSemaine(capture.date_capture);
                const methode = capture.methode || "Inconnue";
                toutesMethodes.add(methode);

                if (!parSemaineMethode[semaine]) {
                    parSemaineMethode[semaine] = {};
                }
                if (!parSemaineMethode[semaine][methode]) {
                    parSemaineMethode[semaine][methode] = 0;
                }
                parSemaineMethode[semaine][methode] += capture.nombre || 0;
            });

            const semaines = Object.keys(parSemaineMethode).sort();
            const methodes = [...toutesMethodes];

            const couleurs = [
                "#ffd700", "#ff6b6b", "#4ecdc4", "#a29bfe",
                "#fd79a8", "#55efc4", "#fdcb6e", "#74b9ff"
            ];

            const datasetsMethode = methodes.map((methode, i) => ({
                label: methode,
                data: semaines.map(s => parSemaineMethode[s][methode] || 0),
                backgroundColor: couleurs[i % couleurs.length]
            }));

            new Chart(document.getElementById("capturesSemaineMethode"), {
                type: "bar",
                data: {
                    labels: semaines,
                    datasets: datasetsMethode
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true }
                    },
                    plugins: {
                        tooltip: { mode: 'index', intersect: false },
                        legend: { position: 'bottom' }
                    }
                }
            });

            const headerRow = document.getElementById("tableSemaineHeader");
            headerRow.innerHTML = '<th>Semaine</th>';
            methodes.forEach(m => {
                const th = document.createElement("th");
                th.textContent = m;
                headerRow.appendChild(th);
            });

            const tbodySemaine = document.querySelector("#tableSemaine tbody");
            tbodySemaine.innerHTML = "";
            semaines.forEach(semaine => {
                const ligne = document.createElement("tr");
                let html = `<td><strong>${semaine}</strong></td>`;
                methodes.forEach(m => {
                    html += `<td>${parSemaineMethode[semaine][m] || 0}</td>`;
                });
                ligne.innerHTML = html;
                tbodySemaine.appendChild(ligne);
            });
        }

        chargerStats();
    </script>
</body>

</html>
