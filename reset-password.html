<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/ruche4.png">
    <title>Nouveau mot de passe — La ruche résiste</title>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-page">
    <main class="login-content">
        <span class="bee"><img class="login-emoji" src="img/mordre.png" alt="Frelon"></span>
        <h1>Nouveau mot de passe</h1>
        <p class="subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

        <section class="card" aria-label="Réinitialiser le mot de passe">
            <form id="formReset" style="display:none">
                <div class="form-group">
                    <label for="pwd1">Nouveau mot de passe</label>
                    <input type="password" id="pwd1" placeholder="Minimum 6 caractères" autocomplete="new-password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="pwd2">Confirmer le mot de passe</label>
                    <input type="password" id="pwd2" autocomplete="new-password" required minlength="6">
                </div>
                <button class="btn" id="btnReset" type="submit">Enregistrer</button>
            </form>
            <p class="message" id="message" role="status" aria-live="polite"></p>
            <p id="attente" class="subtitle" role="status">Vérification du lien…</p>
            <p class="forgot-password"><a href="login.html">Retour à la connexion</a></p>
        </section>
    </main>

    <script type="module">
        import { initResetPasswordPage } from "./js/pages/resetPassword.js";
        initResetPasswordPage();
    </script>
</body>

</html>
