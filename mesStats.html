<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes statistiques — Suivi Frelons</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="user-bar" id="userBar"></div>

    <nav class="navbar">
        <a href="index.html">🐝 Accueil</a>
        <a href="nouvelleCapture.html">📋 Nouvelle capture</a>
        <a href="stat.html">📊 Statistiques</a>
        <a href="mesStats.html" id="navMesStats" style="display:none">📈 Mes stats</a>
    </nav>

    <h2>Mes statistiques</h2>

    <div class="container">
        <div class="stat">
            <div class="stat-title">Total sessions</div>
            <div class="valeur" id="totalCaptures">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Total individus capturés</div>
            <div class="valeur" id="totalNombre">0</div>
        </div>

        <div class="stat">
            <div class="stat-title">Durée totale d'observation</div>
            <div class="valeur" id="dureeTotale">0</div>
        </div>

        
    
        <h3>Efficacité par jour par méthode</h3>
        <canvas id="capturesSemaineMethodeMes"></canvas>

        <table id="tableSemaineMes">
            <thead>
                <tr id="tableSemaineHeaderMes">
                    <th>Date</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>Liste des captures</h3>
        <table id="tableMesCaptures">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Heure</th>
                    <th>Méthode</th>
                    <th>Durée (s)</th>
                    <th>Nombre</th>
                    <th>Lieu</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    
</div>
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById('userBar');
        const { data: { session } } = await supabase.auth.getSession();

        if (!session) {
            // page réservée aux utilisateurs connectés
            window.location.href = 'login.html';
        }

        // montrer le lien de navigation pour les pages où il existe
        const navMes = document.getElementById('navMesStats');
        if (navMes) navMes.style.display = '';

        const { data: profil, error: errorProfil } = await supabase
            .from('profils')
            .select('pseudo')
            .eq('id', session.user.id)
            .single();

        const pseudo = profil?.pseudo || session.user.email;

        bar.innerHTML = `
            <span class="bee-small">🐝</span>
            <span class="pseudo">${pseudo}</span>
            <button id="btnDeconnexion">Se déconnecter</button>
        `;

        document.getElementById('btnDeconnexion').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        async function chargerMesStats() {
            const { data, error } = await supabase
                    .from('captures')
                    .select('*')
                    .or(`user_id.eq.${session.user.id},user_id.eq.${session.user.id}`)
                    .order('date_capture', { ascending: false });

            if (error) {
                console.error(error);
                alert(error.message);
                return;
            }

            document.getElementById('totalCaptures').textContent = data.length;

            const totalNombre = data.reduce((t, c) => t + (c.nombre || 0), 0);
            document.getElementById('totalNombre').textContent = totalNombre;

            const dureeTotale = data.reduce((t, c) => t + (c.duree || 0), 0);
            document.getElementById('dureeTotale').textContent = formaterTemps(dureeTotale);

            const tbody = document.querySelector('#tableMesCaptures tbody');
            tbody.innerHTML = '';
            data.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.date_capture}</td>
                    <td>${c.heure_capture}</td>
                    <td>${c.methode || ''}</td>
                    <td>${c.duree || 0}</td>
                    <td>${c.nombre || 0}</td>
                    <td>${c.lieu || ''}</td>
                `;
                tbody.appendChild(tr);
            });

                // Calculer l'efficacité par jour par méthode (pour cet utilisateur)
                function formaterDateSimple(dateStr) {
                    const date = new Date(dateStr);
                    if (Number.isNaN(date.getTime())) return dateStr;
                    return date.toLocaleDateString('fr-FR', {
                        year: 'numeric', month: '2-digit', day: '2-digit'
                    });
                }

                let parJourMethode = {};
                let toutesMethodes = new Set();

                data.forEach(capture => {
                    const jour = formaterDateSimple(capture.date_capture);
                    const methode = capture.methode || "Inconnue";

                    toutesMethodes.add(methode);

                    if (!parJourMethode[jour]) parJourMethode[jour] = {};
                    if (!parJourMethode[jour][methode]) parJourMethode[jour][methode] = 0;
                    parJourMethode[jour][methode] += capture.nombre || 0;
                });

                const jours = Object.keys(parJourMethode).sort((a, b) => {
                    const dateA = new Date(a.split('/').reverse().join('-'));
                    const dateB = new Date(b.split('/').reverse().join('-'));
                    return dateA - dateB;
                });
                const methodes = [...toutesMethodes];

                const couleurs = [
                    "#ffd700", "#ff6b6b", "#4ecdc4", "#a29bfe",
                    "#fd79a8", "#55efc4", "#fdcb6e", "#74b9ff"
                ];

                const datasetsMethode = methodes.map((methode, i) => ({
                    label: methode,
                    data: jours.map(j => parJourMethode[j][methode] || 0),
                    backgroundColor: couleurs[i % couleurs.length]
                }));

                // Créer le graphique en colonnes empilées
                const ctx = document.getElementById('capturesSemaineMethodeMes');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'bar',
                        data: { labels: jours, datasets: datasetsMethode },
                        options: {
                            responsive: true,
                            scales: {
                                x: { stacked: true },
                                y: { stacked: true, beginAtZero: true }
                            },
                            plugins: {
                                tooltip: { mode: 'index', intersect: false },
                                legend: { position: 'bottom' }
                            }
                        }
                    });
                }

                // Remplir le tableau jour x méthode
                const headerRow = document.getElementById('tableSemaineHeaderMes');
                if (headerRow) {
                    headerRow.innerHTML = '<th>Date</th>';
                    methodes.forEach(m => {
                        const th = document.createElement('th');
                        th.textContent = m;
                        headerRow.appendChild(th);
                    });
                }

                const tbodySemaine = document.querySelector('#tableSemaineMes tbody');
                if (tbodySemaine) {
                    tbodySemaine.innerHTML = '';
                    jours.forEach(jour => {
                        const ligne = document.createElement('tr');
                        let html = `<td><strong>${jour}</strong></td>`;
                        methodes.forEach(m => {
                            html += `<td>${parJourMethode[jour][m] || 0}</td>`;
                        });
                        ligne.innerHTML = html;
                        tbodySemaine.appendChild(ligne);
                    });
                }
        }

        function formaterTemps(secondes) {
            let heures = Math.floor(secondes / 3600);
            let minutes = Math.floor((secondes % 3600) / 60);
            let sec = secondes % 60;
            if (heures > 0) return heures + 'h ' + minutes + 'min ' + sec + 's';
            return minutes + 'min ' + sec + 's';
        }

        chargerMesStats();

    </script>
</body>

</html>
