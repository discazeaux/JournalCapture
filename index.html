<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Supabase</title>
</head>
<body>

<h2>Nouvelle capture</h2>

<form id="captureForm">

    <p>
        <label>Date</label><br>
        <input type="date" id="date_capture" required>
    </p>

    <p>
        <label>Heure</label><br>
        <input type="time" id="heure_capture" required>
    </p>

    <p>
        <label>Méthode</label><br>
        <input type="text" id="methode" required>
    </p>

    <p>
        <label>Nombre</label><br>
        <input type="number" id="nombre" value="1" min="1">
    </p>

    <p>
        <label>Lieu</label><br>
        <input type="text" id="lieu">
    </p>

    <p>
        <label>Notes</label><br>
        <textarea id="notes"></textarea>
    </p>

    <button type="submit">
        Enregistrer
    </button>

</form>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(

    "https://pvqfwozqfndlpfzypbza.supabase.co",

    "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"

);

document.getElementById("captureForm").addEventListener("submit", async (e)=>{

    e.preventDefault();

    const { error } = await supabase

        .from("captures")

        .insert({

            date_capture: document.getElementById("date_capture").value,

            heure_capture: document.getElementById("heure_capture").value,

            methode: document.getElementById("methode").value,

            nombre: Number(document.getElementById("nombre").value),

            lieu: document.getElementById("lieu").value,

            notes: document.getElementById("notes").value

        });

    if(error){

        alert(error.message);

        console.error(error);

    }

    else{

        alert("Capture enregistrée !");

        document.getElementById("captureForm").reset();

    }

});

</script>
</body>
</html>
