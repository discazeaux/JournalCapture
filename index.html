<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi Frelons</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg: #0e0e0e;
            --card: #181818;
            --yellow: #ffd700;
            --yellow-dim: rgba(255, 215, 0, 0.12);
            --text: #ffffff;
            --muted: #888;
            --border: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(255, 215, 0, 0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero {
            text-align: center;
            margin-bottom: 56px;
        }

        .bee {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
        }

        h1 {
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 700;
            color: var(--yellow);
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 560px;
        }

        .nav-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 24px;
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
        }

        .nav-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--yellow-dim);
            opacity: 0;
            transition: opacity 0.2s;
            border-radius: 14px;
        }

        .nav-card:hover {
            border-color: var(--yellow);
            transform: translateY(-3px);
        }

        .nav-card:hover::after {
            opacity: 1;
        }

        .nav-card:active {
            transform: translateY(0);
        }

        .card-icon {
            font-size: 32px;
            line-height: 1;
            position: relative;
            z-index: 1;
        }

        .card-label {
            font-size: 18px;
            font-weight: 700;
            color: var(--yellow);
            position: relative;
            z-index: 1;
        }

        .card-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            position: relative;
            z-index: 1;
        }

        .card-arrow {
            margin-top: auto;
            font-size: 20px;
            color: var(--yellow);
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.2s, transform 0.2s;
            position: relative;
            z-index: 1;
        }

        .nav-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        footer {
            margin-top: 56px;
            color: var(--border);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .user-bar {
            position: fixed;
            top: 16px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
        }

        .user-bar .pseudo {
            color: var(--yellow);
        }

        .user-bar .bee-small {
            font-size: 18px;
        }

        .user-bar button, .user-bar a {
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .user-bar button:hover, .user-bar a:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        @media (max-width: 480px) {
            .user-bar {
                top: 10px;
                right: 10px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .nav {
                grid-template-columns: 1fr;
            }
            .nav-card {
                flex-direction: row;
                align-items: center;
                gap: 16px;
                padding: 20px;
            }
            .card-content {
                flex: 1;
            }
            .card-arrow {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>

    <div class="user-bar" id="userBar">
        <!-- rempli par JS -->
    </div>

    <div class="hero">
        <span class="bee">🐝</span>
        <h1>Suivi Frelons</h1>
        <p class="subtitle">Enregistrez vos captures et consultez les statistiques</p>
    </div>

    <nav class="nav">
        <a class="nav-card" href="nouvelleCapture.html">
            <span class="card-icon">📋</span>
            <div class="card-content">
                <div class="card-label">Nouvelle capture</div>
                <p class="card-desc">Saisir une session, démarrer le chrono et enregistrer</p>
            </div>
            <span class="card-arrow">→</span>
        </a>

        <a class="nav-card" href="stat.html">
            <span class="card-icon">📊</span>
            <div class="card-content">
                <div class="card-label">Statistiques</div>
                <p class="card-desc">Consulter les graphiques, totaux et efficacité par méthode</p>
            </div>
            <span class="card-arrow">→</span>
        </a>
    </nav>

    <footer>suivi-frelons</footer>

    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById("userBar");

        const { data: { session } } = await supabase.auth.getSession();

        console.log("Session:", session);

        if (session) {
            console.log("User ID:", session.user.id);

            const { data: profil, error: errorProfil } = await supabase
                .from("profils")
                .select("pseudo")
                .eq("id", session.user.id)
                .single();

            console.log("Profil:", profil, "Erreur:", errorProfil);

            const pseudo = profil?.pseudo || session.user.email;

            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                <button id="btnDeconnexion">Se déconnecter</button>
            `;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });

        } else {
            bar.innerHTML = `
                <button id="btnConnexion">Se connecter</button>
            `;
            document.getElementById("btnConnexion").addEventListener("click", () => {
                window.location.href = "login.html";
            });
        }
    </script>

</body>
</html>
