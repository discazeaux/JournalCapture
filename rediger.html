<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rédiger un article — Suivi Frelons</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg: #faf7f0;
            --card: #ffffff;
            --yellow: #b8860b;
            --yellow-soft: #f5e6b8;
            --yellow-dim: rgba(184, 134, 11, 0.08);
            --text: #2d2a24;
            --muted: #8a8578;
            --border: #e8e2d4;
            --danger: #c0392b;
            --success: #27ae60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 40px 24px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .header h1 .bee {
            font-size: 26px;
            margin-right: 10px;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 18px;
            background: var(--card);
            transition: border-color 0.2s, color 0.2s;
        }

        .back-link:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .user-bar {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 10;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .user-bar .pseudo {
            color: var(--yellow);
        }

        .user-bar .bee-small {
            font-size: 18px;
        }

        .user-bar button, .user-bar a {
            background: none;
            border: 1px solid var(--border);
            border-radius: 99px;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .user-bar button:hover, .user-bar a:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .editor {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-group input[type="text"] {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            padding: 12px 14px;
            transition: border-color 0.2s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: var(--yellow);
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 8px;
        }

        /* Style EasyMDE pour le thème clair */
        .EasyMDEContainer {
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: var(--bg);
        }

        .EasyMDEContainer .editor-toolbar {
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }

        .EasyMDEContainer .editor-toolbar button {
            color: var(--muted);
            border-color: transparent;
        }

        .EasyMDEContainer .editor-toolbar button:hover,
        .EasyMDEContainer .editor-toolbar button.active {
            background: var(--yellow-dim);
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .EasyMDEContainer .CodeMirror {
            background: var(--bg);
            color: var(--text);
            border: none;
            font-family: 'Space Grotesk', monospace;
            font-size: 15px;
            line-height: 1.7;
            min-height: 300px;
        }

        .EasyMDEContainer .CodeMirror-cursor {
            border-left-color: var(--yellow);
        }

        .EasyMDEContainer .CodeMirror-selected {
            background: var(--yellow-dim);
        }

        .EasyMDEContainer .editor-preview {
            background: var(--bg);
            color: var(--text);
        }

        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3 {
            color: var(--text);
        }

        .EasyMDEContainer .editor-preview a {
            color: var(--yellow);
        }

        .EasyMDEContainer .editor-preview blockquote {
            border-left-color: var(--yellow);
            color: var(--muted);
        }

        .EasyMDEContainer .editor-preview code {
            background: var(--yellow-soft);
            border-radius: 4px;
            padding: 2px 6px;
        }

        .EasyMDEContainer .editor-preview pre {
            background: #f4f0e6;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .EasyMDEContainer .editor-statusbar {
            background: var(--card);
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 99px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }

        .btn:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .btn-primary {
            background: var(--yellow);
            border-color: var(--yellow);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #a0760a;
            border-color: #a0760a;
            color: #ffffff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .message.error {
            display: block;
            background: rgba(192, 57, 43, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .access-denied {
            text-align: center;
            color: var(--muted);
            padding: 80px 20px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            font-size: 15px;
            background: var(--card);
        }

        .access-denied .bee {
            font-size: 44px;
            display: block;
            margin-bottom: 16px;
        }

        .access-denied a {
            color: var(--yellow);
            text-decoration: none;
            font-weight: 600;
        }

        footer {
            margin-top: 64px;
            color: var(--border);
            font-size: 12px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .user-bar {
                top: 12px;
                right: 12px;
                padding: 6px 12px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
                margin-bottom: 36px;
            }
            .editor {
                padding: 24px;
            }
            .actions {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="user-bar" id="userBar">
        <!-- rempli par JS -->
    </div>

    <div class="container">
        <div class="header">
            <h1><span class="bee">🐝</span>Rédiger un article</h1>
            <a class="back-link" href="blog.html">← Blog</a>
        </div>

        <div id="editorContainer">
            <!-- rempli par JS -->
        </div>
    </div>

    <footer>suivi-frelons</footer>

    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById("userBar");
        const editorContainer = document.getElementById("editorContainer");

        const { data: { session } } = await supabase.auth.getSession();

        // Charger le profil si connecté (pseudo + rôle)
        let profil = null;
        if (session) {
            const { data: p } = await supabase
                .from("profils")
                .select("pseudo, role")
                .eq("id", session.user.id)
                .single();
            profil = p;
        }

        const pseudo = profil?.pseudo || session.user?.email;
        const estAdmin = profil?.role === 'admin';

        // Vérifier que l'utilisateur est connecté
        if (!session) {
            bar.innerHTML = `
                <button id="btnConnexion">Se connecter</button>
            `;
            document.getElementById("btnConnexion").addEventListener("click", () => {
                window.location.href = "login.html";
            });

            editorContainer.innerHTML = `
                <div class="access-denied">
                    <span class="bee">🐝</span>
                    Vous devez être connecté pour rédiger un article.
                    <br><br>
                    <a href="login.html">Se connecter</a>
                </div>
            `;
        } else if (!estAdmin) {
            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                <button id="btnDeconnexion">Se déconnecter</button>
            `;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });

            editorContainer.innerHTML = `
                <div class="access-denied">
                    <span class="bee">🐝</span>
                    Accès réservé à l'administrateur du site.
                    <br><br>
                    <a href="blog.html">← Retour au blog</a>
                </div>
            `;
        } else {
            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                <button id="btnDeconnexion">Se déconnecter</button>
            `;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });

            // Lire le paramètre ?slug=... dans l'URL (reprise d'article/brouillon)
            const params = new URLSearchParams(window.location.search);
            const slugExistant = params.get("slug");

            // Charger l'article existant si on est en mode édition
            let articleExistant = null;
            if (slugExistant) {
                const { data: article } = await supabase
                    .from("articles")
                    .select("id, titre, slug, contenu, publie")
                    .eq("slug", slugExistant)
                    .single();
                articleExistant = article;
            }

            // Afficher l'éditeur
            editorContainer.innerHTML = `
                <div class="editor">
                    <div class="form-group">
                        <label for="titre">Titre</label>
                        <input type="text" id="titre" placeholder="Titre de l'article" required>
                    </div>

                    <div class="form-group">
                        <label for="slug">Slug (URL)</label>
                        <input type="text" id="slug" placeholder="mon-premier-article" required>
                        <p class="hint">Identifiant unique utilisé dans l'URL : article.html?slug=...</p>
                    </div>

                    <div class="form-group">
                        <label for="contenu">Contenu (Markdown)</label>
                        <textarea id="contenu" placeholder="Écrivez votre article en Markdown..."></textarea>
                        <p class="hint">Markdown supporté : titres, gras, listes, citations, code, images...</p>
                    </div>

                    <div class="actions">
                        <button class="btn btn-primary" id="btnPublier">Publier</button>
                        <button class="btn" id="btnBrouillon">Enregistrer en brouillon</button>
                    </div>

                    <div class="message" id="message"></div>
                </div>
            `;

            const titreInput = document.getElementById("titre");
            const slugInput = document.getElementById("slug");
            const btnPublier = document.getElementById("btnPublier");
            const btnBrouillon = document.getElementById("btnBrouillon");
            const message = document.getElementById("message");

            // Mode édition : pré-remplir le formulaire avec l'article existant
            if (articleExistant) {
                document.querySelector(".header h1").innerHTML =
                    '<span class="bee">🐝</span>Modifier un article';
                document.title = "Modifier un article — Suivi Frelons";
                titreInput.value = articleExistant.titre || "";
                slugInput.value = articleExistant.slug || "";
                slugInput.dataset.manual = "true";
            }

            // Initialiser EasyMDE
            const easyMDE = new EasyMDE({
                element: document.getElementById("contenu"),
                spellChecker: false,
                autofocus: false,
                placeholder: "Écrivez votre article en Markdown...",
                status: ["lines", "words", "cursor"],
                toolbar: [
                    "bold", "italic", "heading", "|",
                    "quote", "unordered-list", "ordered-list", "|",
                    "link", "image", "code", "|",
                    "preview", "side-by-side", "fullscreen", "|",
                    "guide"
                ],
                minHeight: "300px",
                renderingConfig: {
                    singleLineBreaks: true,
                    codeSyntaxHighlighting: true
                }
            });

            // Générer automatiquement le slug à partir du titre
            titreInput.addEventListener("input", () => {
                if (!slugInput.dataset.manual) {
                    slugInput.value = titreInput.value
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .replace(/[^a-z0-9]+/g, "-")
                        .replace(/^-+|-+$/g, "");
                }
            });

            slugInput.addEventListener("input", () => {
                slugInput.dataset.manual = "true";
            });

            // Pré-remplir le contenu EasyMDE après initialisation
            if (articleExistant) {
                easyMDE.value(articleExistant.contenu || "");
            }

            async function sauvegarder(publie) {
                const titre = titreInput.value.trim();
                const slug = slugInput.value.trim();
                const contenu = easyMDE.value().trim();

                if (!titre || !slug || !contenu) {
                    message.className = "message error";
                    message.textContent = "Veuillez remplir tous les champs.";
                    return;
                }

                btnPublier.disabled = true;
                btnBrouillon.disabled = true;

                // Mode édition : mettre à jour l'article existant
                let data, error;
                if (articleExistant) {
                    ({ data, error } = await supabase
                        .from("articles")
                        .update({
                            titre,
                            slug,
                            contenu,
                            publie
                        })
                        .eq("id", articleExistant.id)
                        .select()
                        .single());
                } else {
                    // Nouvel article : insertion
                    ({ data, error } = await supabase
                        .from("articles")
                        .insert({
                            auteur_id: session.user.id,
                            titre,
                            slug,
                            contenu,
                            publie
                        })
                        .select()
                        .single());
                }

                if (error) {
                    console.error("Erreur enregistrement:", error);
                    message.className = "message error";
                    message.textContent = error.message.includes("duplicate")
                        ? "Ce slug existe déjà. Choisissez-en un autre."
                        : "Erreur lors de l'enregistrement : " + error.message;
                } else {
                    message.className = "message success";
                    message.textContent = publie
                        ? (articleExistant
                            ? "Article modifié et publié avec succès !"
                            : "Article publié avec succès !")
                        : (articleExistant
                            ? "Brouillon mis à jour avec succès !"
                            : "Brouillon enregistré avec succès !");

                    if (publie) {
                        setTimeout(() => {
                            window.location.href = `article.html?slug=${encodeURIComponent(slug)}`;
                        }, 1200);
                    }
                }

                btnPublier.disabled = false;
                btnBrouillon.disabled = false;
            }

            btnPublier.addEventListener("click", () => sauvegarder(true));
            btnBrouillon.addEventListener("click", () => sauvegarder(false));
        }
    </script>

</body>
</html>
