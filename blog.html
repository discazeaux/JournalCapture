<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La ruche résiste</title>
    <link rel="stylesheet" href="navigation.css">
    <script src="navigation.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg: #faf7f0;
            --card: #ffffff;
            --yellow: #b8860b;
            --yellow-soft: #f5e6b8;
            --yellow-dim: rgba(184, 134, 11, 0.08);
            --text: #2d2a24;
            --muted: #8a8578;
            --border: #e8e2d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 40px 24px;
        }

        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .page-intro {
            margin-bottom: 32px;
        }

        .page-intro h1 {
            font-size: clamp(24px, 4vw, 32px);
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .flaticon-credit {
            margin-top: 12px;
            font-size: 11px;
            color: var(--muted);
        }

        .flaticon-credit a {
            color: var(--yellow);
            text-decoration: none;
        }

        .flaticon-credit a:hover {
            text-decoration: underline;
        }

        .user-bar {
            position: fixed;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 2000;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .user-bar .pseudo {
            color: var(--yellow);
        }

        .user-bar .bee-small {
            font-size: 18px;
        }

        .user-bar button, .user-bar a {
            background: none;
            border: 1px solid var(--border);
            border-radius: 99px;
            color: var(--muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .user-bar button:hover, .user-bar a:hover {
            border-color: var(--yellow);
            color: var(--yellow);
        }

        .articles {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .article-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 36px;
            text-decoration: none;
            color: var(--text);
            display: block;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .article-card:hover {
            border-color: var(--yellow);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .article-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .article-card .date {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 16px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .article-card .excerpt {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 80px 20px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            font-size: 15px;
            background: var(--card);
        }

        .empty .bee {
            font-size: 44px;
            display: block;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin: 48px 0 16px;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .count {
            background: var(--yellow-soft);
            color: var(--yellow);
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 10px;
        }

        .brouillon-card {
            background: var(--card);
            border: 1px dashed var(--yellow);
            border-radius: 16px;
            padding: 24px 32px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .brouillon-card:hover {
            border-color: var(--yellow);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .brouillon-card h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .brouillon-card .date {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .brouillon-card .edit-link {
            background: var(--yellow-dim);
            color: var(--yellow);
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            white-space: nowrap;
        }

        .brouillon-card .edit-link:hover {
            background: var(--yellow-soft);
        }

        .brouillons-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .article-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--yellow);
        }

        .article-card {
            position: relative;
        }

        footer {
            margin-top: 64px;
            color: var(--border);
            font-size: 12px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .user-bar {
                top: 12px;
                right: 12px;
                padding: 6px 12px;
            }
            .article-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="user-bar" id="userBar">
        <!-- rempli par JS -->
    </div>

    <div class="container">
        <div class="page-intro">
            <h1>📖 Les nouvelles</h1>
        </div>

        <div class="articles" id="articles">
            <!-- rempli par JS -->
        </div>
    </div>

    <footer>
        suivi-frelons
        <div class="flaticon-credit">
            <a href="https://www.flaticon.com/fr/icones-gratuites/abeille" title="abeille icônes">Abeille icônes créées par iconixar - Flaticon</a>
        </div>
    </footer>

    <script>
        initNavigation({ univers: 'blog', sectionActive: 'blog' });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module">
        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById("userBar");
        const articlesEl = document.getElementById("articles");

        const { data: { session } } = await supabase.auth.getSession();

        let estAdmin = false;
        if (session) {
            const { data: profil } = await supabase
                .from("profils")
                .select("pseudo, role")
                .eq("id", session.user.id)
                .single();

            const pseudo = profil?.pseudo || session.user.email;
            estAdmin = profil?.role === 'admin';

            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                <button id="btnDeconnexion">Se déconnecter</button>
            `;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });
        } else {
            bar.innerHTML = `
                <button id="btnConnexion">Se connecter</button>
            `;
            document.getElementById("btnConnexion").addEventListener("click", () => {
                window.location.href = "login.html";
            });
        }

        // Partie réservée à l'admin : afficher les brouillons
        if (estAdmin) {
            const { data: brouillons } = await supabase
                .from("articles")
                .select("id, titre, slug, created_at")
                .eq("publie", false)
                .order("created_at", { ascending: false });

            if (brouillons && brouillons.length > 0) {
                const brouillonsHtml = brouillons.map(b => {
                    const date = new Date(b.created_at).toLocaleDateString("fr-FR", {
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    });
                    return `
                        <a class="brouillon-card" href="rediger.html?slug=${encodeURIComponent(b.slug)}">
                            <div>
                                <h3>${b.titre || "Sans titre"}</h3>
                                <div class="date">${date} — brouillon</div>
                            </div>
                            <span class="edit-link">✏️ Reprendre</span>
                        </a>
                    `;
                }).join("");

                articlesEl.insertAdjacentHTML("afterbegin", `
                    <div class="section-title">📝 Brouillons <span class="count">${brouillons.length}</span></div>
                    <div class="brouillons-list">${brouillonsHtml}</div>
                `);
            }
        }

        // Charger les articles publiés
        const { data: articles, error } = await supabase
            .from("articles")
            .select("id, titre, slug, created_at, contenu")
            .eq("publie", true)
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Erreur chargement articles:", error);
            articlesEl.insertAdjacentHTML("beforeend", `<div class="empty">Erreur lors du chargement des articles.</div>`);
        } else if (!articles || articles.length === 0) {
            articlesEl.insertAdjacentHTML("beforeend", `
                <div class="empty">
                    <span class="bee"><img class="bee-svg" src="rucher2.png" alt="Ruche" aria-label="Ruche"></span>
                    Aucun article publié pour le moment.
                </div>
            `);
        } else {
            articlesEl.insertAdjacentHTML("beforeend", articles.map(a => {
                const date = new Date(a.created_at).toLocaleDateString("fr-FR", {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                });
                // Convertir le Markdown en texte pour l'extrait
                const excerpt = marked.parse(a.contenu || "")
                    .replace(/<[^>]*>/g, "")
                    .replace(/\s+/g, " ")
                    .trim()
                    .slice(0, 200);
                return `
                    <a class="article-card" href="article.html?slug=${encodeURIComponent(a.slug)}">
                        ${estAdmin ? `<span class="article-actions">✏️ Modifier</span>` : ''}
                        <h2>${a.titre}</h2>
                        <div class="date">${date}</div>
                        <p class="excerpt">${excerpt}...</p>
                    </a>
                `;
            }).join(""));
        }
    </script>

</body>
</html>
