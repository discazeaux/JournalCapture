<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques sur le frelon</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-darker: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --accent-yellow: #ffd700;
            --accent-yellow-dark: #cc9900;
            --border-color: #333333;
            --input-bg: #1e1e1e;
            --input-border: #444444;
            --button-bg: #ffd700;
            --button-hover: #e6c200;
            --error-color: #ff5555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        h2 {
            color: var(--accent-yellow);
            margin-bottom: 20px;
            font-size: 28px;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        #captureForm {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-darker);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
        }

        input[type="date"],
        input[type="time"],
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="date"]:focus,
        input[type="time"]:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.2);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffd700' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 1em;
            padding-right: 36px;
        }

        select option {
            background-color: var(--bg-darker);
            color: var(--text-primary);
            padding: 8px 12px;
        }

        select option:hover {
            background-color: var(--input-border);
        }

        select option:checked {
            background-color: var(--accent-yellow-dark);
            color: var(--bg-dark);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--button-bg);
            color: var(--bg-dark);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: var(--button-hover);
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            background-color: var(--input-border);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .required-field::after {
            content: " *";
            color: var(--error-color);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            #captureForm {
                padding: 20px;
            }
        }
        #startChrono,
        #stopChrono {
            width:48%;
            padding:10px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            background:#ffd700;
            color:#121212;
            font-weight:bold;
        }

        #stopChrono:disabled {
            opacity:0.4;
            cursor:not-allowed;
        }
    </style>
</head>
<body>

    <h2>Nouvelle capture</h2>

    <form id="captureForm">

        <p>
            <label class="required-field">Date</label>
            <input type="date" id="date_capture" required>
        </p>

        <p>
            <label class="required-field">Heure</label>
            <input type="time" id="heure_capture" required>
        </p>

        <p>
            <label class="required-field">Méthode</label>
            <select id="methode" required>
                <option value="" disabled>Sélectionnez une méthode</option>
                <option value="PDR">DPR</option>
                <option value="Piége">Piége</option>
                <option value="Raquette électrique" selected>Raquette électrique</option>
                <option value="Harpe">Harpe</option>
            </select>
        </p>
        <p>
           <label>Durée de capture</label>

            <div id="chrono" style="
                font-size:28px;
                color:#ffd700;
                text-align:center;
                margin-bottom:10px;
            ">
                00:00
            </div>

            <button type="button" id="startChrono">
                Démarrer
            </button>

            <button type="button" id="stopChrono" disabled>
                Arrêter
            </button>
        </p>
        <p>
            <label>Nombre</label>
            <input type="number" id="nombre" value="1" min="1">
        </p>

        <p>
            <label>Lieu</label>
            <input type="text" id="lieu" value="maison">
        </p>

        <p>
            <label>Notes</label>
            <textarea id="notes"></textarea>
        </p>

        <button type="submit">
            Enregistrer
        </button>

    </form>

    <script type="module">
        let chronoInterval;
        let secondes = 0;

        const chronoDisplay = document.getElementById("chrono");
        const startButton = document.getElementById("startChrono");
        const stopButton = document.getElementById("stopChrono");


        function afficherChrono() {

            let minutes = Math.floor(secondes / 60);
            let sec = secondes % 60;

            chronoDisplay.textContent =
                String(minutes).padStart(2, '0') + ":" +
                String(sec).padStart(2, '0');
        }


        startButton.addEventListener("click", () => {

            secondes = 0;
            afficherChrono();

            chronoInterval = setInterval(() => {
                secondes++;
                afficherChrono();
            }, 1000);


            startButton.disabled = true;
            stopButton.disabled = false;
        });


        stopButton.addEventListener("click", () => {

            clearInterval(chronoInterval);

            startButton.disabled = false;
            stopButton.disabled = true;

        });

        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        // Initialiser les valeurs par défaut pour date, heure et lieu
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const formattedDate = now.toISOString().split('T')[0];
            const formattedTime = now.toTimeString().split(' ')[0].substring(0, 5);

            document.getElementById('date_capture').value = formattedDate;
            document.getElementById('heure_capture').value = formattedTime;
            document.getElementById('lieu').value = 'maison';
        });

        document.getElementById("captureForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = "Enregistrement en cours...";

            const { error } = await supabase
                .from("captures")
                .insert({
                    date_capture: document.getElementById("date_capture").value,
                    heure_capture: document.getElementById("heure_capture").value,
                    methode: document.getElementById("methode").value,
                    duree: secondes,
                    nombre: Number(document.getElementById("nombre").value),
                    lieu: document.getElementById("lieu").value,
                    notes: document.getElementById("notes").value
                });

            if (error) {
                alert(error.message);
                console.error(error);
            } else {
                alert("Capture enregistrée !");
                document.getElementById("captureForm").reset();
            }

            submitButton.disabled = false;
            submitButton.textContent = "Enregistrer";
        });

    </script>
</body>
</html>
