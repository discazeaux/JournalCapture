<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrer une nouvelle capture de frelons</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="user-bar" id="userBar">
        <!-- rempli par JS -->
    </div>



    <nav class="navbar">
        <a href="index.html">🐝 Accueil</a>
        <a href="nouvelleCapture.html" class="active">📋 Nouvelle capture</a>
        <a href="stat.html">📊 Statistiques</a>
    </nav>

    <h2>Nouvelle capture</h2>

    <form id="captureForm">

        <p>
            <label class="required-field">Date</label>
            <input type="date" id="date_capture" required>
        </p>

        <p>
            <label class="required-field">Heure</label>
            <input type="time" id="heure_capture" required>
        </p>

        <p>
            <label class="required-field">Méthode</label>
            <select id="methode" required>
                <option value="" disabled>Sélectionnez une méthode</option>
                <option value="PDR">DPR</option>
                <option value="Piége">Piége</option>
                <option value="Raquette électrique" selected>Raquette électrique</option>
                <option value="Harpe">Harpe</option>
            </select>
        </p>
        <p>
            <label>Durée de capture</label>

            <div id="chrono" style="
                font-size:28px;
                color:#ffd700;
                text-align:center;
                margin-bottom:10px;
            ">
                00:00
            </div>

            <input id="duree_capture" type="text" value="00:00" placeholder="mm:ss" style="width:100%; padding:10px; margin-bottom:12px; background:#1e1e1e; border:1px solid #444; border-radius:6px; color:#fff;" />

            <button type="button" id="startChrono">
                Démarrer
            </button>

            <button type="button" id="stopChrono" disabled>
                Arrêter
            </button>
        </p>
        <p>
            <label>Nombre</label>
            <input type="number" id="nombre" value="1" min="1">
        </p>

        <p>
            <label>Lieu</label>
            <input type="text" id="lieu" value="maison">
        </p>

        <p>
            <label>Notes</label>
            <textarea id="notes"></textarea>
        </p>

        <button type="submit">
            Enregistrer
        </button>

    </form>

    <script type="module">
        let chronoInterval;
        let secondes = 0;

        const chronoDisplay = document.getElementById("chrono");
        const dureeInput = document.getElementById("duree_capture");
        const startButton = document.getElementById("startChrono");
        const stopButton = document.getElementById("stopChrono");


        function formatDuree(seconds) {
            const minutes = Math.floor(seconds / 60);
            const sec = seconds % 60;
            return String(minutes).padStart(2, '0') + ":" + String(sec).padStart(2, '0');
        }

        function parseDuree(value) {
            const raw = String(value || '').trim();
            if (!raw) return null;
            const parts = raw.split(':').map(part => part.trim());
            if (parts.length === 2) {
                const minutes = Number(parts[0]);
                const secondsPart = Number(parts[1]);
                if (Number.isInteger(minutes) && minutes >= 0 && Number.isInteger(secondsPart) && secondsPart >= 0 && secondsPart < 60) {
                    return minutes * 60 + secondsPart;
                }
            }
            if (parts.length === 1) {
                const secondsOnly = Number(parts[0]);
                if (Number.isInteger(secondsOnly) && secondsOnly >= 0) {
                    return secondsOnly;
                }
            }
            return null;
        }

        function afficherChrono() {
            chronoDisplay.textContent = formatDuree(secondes);
            if (dureeInput) {
                dureeInput.value = formatDuree(secondes);
            }
        }


        startButton.addEventListener("click", () => {

            secondes = 0;
            afficherChrono();

            chronoInterval = setInterval(() => {
                secondes++;
                afficherChrono();
            }, 1000);


            startButton.disabled = true;
            stopButton.disabled = false;
        });


        stopButton.addEventListener("click", () => {

            clearInterval(chronoInterval);

            startButton.disabled = false;
            stopButton.disabled = true;

            if (dureeInput) {
                const parsed = parseDuree(dureeInput.value);
                if (parsed !== null) {
                    secondes = parsed;
                    afficherChrono();
                }
            }

        });

        dureeInput.addEventListener("change", () => {
            const parsed = parseDuree(dureeInput.value);
            if (parsed !== null) {
                secondes = parsed;
                afficherChrono();
            } else {
                dureeInput.value = formatDuree(secondes);
            }
        });

        import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

        const supabase = createClient(
            "https://pvqfwozqfndlpfzypbza.supabase.co",
            "sb_publishable_PVbd_09mi39UIQ-9QGS3ug_ftskAI9t"
        );

        const bar = document.getElementById("userBar");

        const { data: { session } } = await supabase.auth.getSession();

        console.log("Session:", session);

        if (!session) {
            document.getElementById("cardCapture").style.display = "none";
        }

        if (session) {
            console.log("User ID:", session.user.id);

            const { data: profil, error: errorProfil } = await supabase
                .from("profils")
                .select("pseudo, codePostal")
                .eq("id", session.user.id)
                .single();

            console.log("Profil:", profil, "Erreur:", errorProfil);

            const pseudo = profil?.pseudo || session.user.email;
            const lieuDefaut = profil?.codePostal || 'maison';

            bar.innerHTML = `
                <span class="bee-small">🐝</span>
                <span class="pseudo">${pseudo}</span>
                <button id="btnDeconnexion">Se déconnecter</button>
            `;
            document.getElementById('lieu').value = lieuDefaut;

            document.getElementById("btnDeconnexion").addEventListener("click", async () => {
                await supabase.auth.signOut();
                window.location.href = "login.html";
            });

        } else {
            bar.innerHTML = `
                <button id="btnConnexion">Se connecter</button>
            `;
            document.getElementById("btnConnexion").addEventListener("click", () => {
                window.location.href = "login.html";
            });
        }

        // Initialiser les valeurs par défaut pour date, heure et lieu
        function initialiserValeursParDefaut() {
            const now = new Date();
            const formattedDate = now.toISOString().split('T')[0];
            const formattedTime = now.toTimeString().split(' ')[0].substring(0, 5);
            const lieuInput = document.getElementById('lieu');

            document.getElementById('date_capture').value = formattedDate;
            document.getElementById('heure_capture').value = formattedTime;
            if (lieuInput && !lieuInput.value.trim()) {
                lieuInput.value = 'maison';
            }
        }

        initialiserValeursParDefaut();

        document.addEventListener('DOMContentLoaded', initialiserValeursParDefaut);

        document.getElementById("captureForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = "Enregistrement en cours...";

            const { error } = await supabase
                .from("captures")
                .insert({
                    date_capture: document.getElementById("date_capture").value,
                    heure_capture: document.getElementById("heure_capture").value,
                            methode: document.getElementById("methode").value,
                    duree: secondes,
                    nombre: Number(document.getElementById("nombre").value),
                    // Associer la capture à l'utilisateur connecté
                    user_id: session ? session.user.id : null,
                    lieu: document.getElementById("lieu").value,
                    notes: document.getElementById("notes").value
                });

            if (error) {
                alert(error.message);
                console.error(error);
            } else {
                alert("Capture enregistrée !");
                document.getElementById("captureForm").reset();
            }

            submitButton.disabled = false;
            submitButton.textContent = "Enregistrer";
        });

    </script>
</body>
</html>
