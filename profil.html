<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/img/ruche4.png">
    <title>Mon profil — La ruche résiste</title>
    <script src="js/config.js"></script>
    <script src="js/cookies.js"></script>
    <script src="js/navigation.js"></script>
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="09e3a93a-9f91-437e-846b-b3f5f8444ecb"></script>
</head>
<body>
    <div class="user-bar" id="userBar"></div>

    <main class="container container-narrow">
        <h2 class="mb-24">Mon profil</h2>
        <section class="settings-section">
            <form id="profileForm" class="profile-form" novalidate>
                <div class="form-group">
                    <label for="profileEmail">Adresse e-mail</label>
                    <input type="email" id="profileEmail" readonly>
                </div>
                <div class="form-group">
                    <label for="profileName">Pseudo</label>
                    <input type="text" id="profileName" maxlength="80" required autocomplete="nickname">
                </div>
                <div class="form-group">
                    <label for="profilePostalCode">Code postal</label>
                    <input type="text" id="profilePostalCode" maxlength="12" required autocomplete="postal-code">
                </div>
                <button type="submit" class="btn-add" id="saveProfile">Enregistrer</button>
                <p id="profileMessage" class="message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-legal"><a href="confidentialite.html">Confidentialité &amp; cookies</a><a href="mentions-legales.html">Mentions légales</a></div>
    </footer>
    <script>
        initNavigation({ univers: 'frelon' });
    </script>
    <script type="module" src="./js/pages/profil.js"></script>
</body>
</html>
